<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saumya Karan</title>
    <meta
      name="description"
      content="Saumya Karan — indie dev. Minimal index of apps and contact."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="page">
    <div class="pageInner">
      <header class="siteHeader">
        <div class="siteHeaderInner">
          <a class="siteTitle" href="/">Saumya Karan</a>
          <nav class="flex items-center gap-5">
            <a class="navLink" href="/apps/">Apps</a>
          </nav>
        </div>
      </header>

      <main class="pageMain">
        <div class="containerShell">
          <section class="section">
            <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">
              Saumya Karan
            </h1>
            <p class="mt-4 text-base text-muted-foreground sm:text-lg">
              Indie-dev, noob.
            </p>
          </section>

          <section class="section pt-2">
            <div class="flex items-center justify-between">
              <h2 class="sectionTitle">Apps</h2>
              <a class="btn btnLink" href="/apps/">View all </a>
            </div>

            <div class="sectionBody">
              <article class="appCard">
                <div class="flex items-start justify-between gap-6">
                  <div>
                    <div class="appCardBadge">iOS</div>
                    <h3 class="appCardTitle mt-3">Campfire</h3>
                    <p class="appCardDesc">A quiet 30-minute focus timer.</p>
                  </div>
                  <img
                    src="/apps/campfire/icon.png"
                    alt="Campfire"
                    class="hidden h-16 w-16 border border-border sm:block"
                    aria-hidden="true"
                  />
                </div>

                <div class="mt-5">
                  <a class="btn btnLink linkWithArrow" href="/apps/campfire/"
                    >View <span class="pl-2 arrow">→</span></a
                  >
                </div>
              </article>
            </div>
          </section>

          <section class="section pt-2">
            <h2 class="sectionTitle">Contact</h2>
            <div class="sectionBody">
              <p class="muted">
                Email:
                <a class="link" href="mailto:curiousqubit@protonmail.com"
                  >curiousqubit@protonmail.com</a
                >
              </p>
            </div>
          </section>
        </div>
      </main>

      <footer class="siteFooter">
        <div class="containerShell">© 2026 Saumya Karan</div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
